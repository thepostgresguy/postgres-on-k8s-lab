name: lab

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run, so a broken upstream image or manifest shows up
  # here before a reader finds it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/check-pins.sh
      - run: shellcheck scripts/*.sh tests/*.sh

  part-01:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' versions.env >> "$GITHUB_ENV"
      - uses: helm/kind-action@v1.15.2
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          config: kind/cluster.yaml
          cluster_name: pg-k8s-lab
      - run: make operator part-01 load test-part-01
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get nodes -L topology.kubernetes.io/zone
          kubectl get cluster,pods,pvc -o wide
          kubectl describe cluster pg-lab
          kubectl -n cnpg-system logs deployment/cnpg-controller-manager --tail=200
